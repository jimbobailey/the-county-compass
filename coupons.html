<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    The County Compass - Coupons

  <link

    href="css/style.css"

</head>

<body>

        </span>

    <nav class="main-nav">

      </a>

      <a href="businesses.html">

      <a href="coupons.html">

      </a>
