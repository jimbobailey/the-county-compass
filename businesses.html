<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    The County Compass - Businesses
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <header class="site-header">

    <div class="logo">

      <img
        src="images/site/county-compass-logo.png"
        alt="The County Compass"
        class="site-logo"
      >

      <div class="logo-text">
        <span>
          The County Compass
        </span>
      </div>

    </div>

    <nav class="main-nav">

      <a href="index.html">
        Home
      </a>

      <a href="businesses.html">
        Businesses
      </a>

      <a href="coupons.html">
        Coupons
      </a>

      <a href="events.html">
        Events
      </a>
      <a href="hiring.html">Hiring</a>

      <a href="advertise.html">
        Advertise
      </a>
      <a href="contact.html">Contact</a>

    </nav>

  </header>

<section class="page-banner">
  <img
    src="images/site/businesses-banner.png"
    alt="Business Banner"
    class="page-banner-img"
  >
</section>
  <h2 class="section-title">
  Local Sponsors
</h2>

<div id="businessesAds"></div>

<div class="featured-heading-wrap">
  <img
    src="images/site/featured.png"
    alt="Featured Businesses"
    class="featured-heading-img"
  >
</div>

  <main class="page-section">

  
    <h2 class="section-title">
      Local Business Directory
    </h2>

    <p class="page-intro">
      Find local businesses, restaurants,
      services, shops, and hidden gems
      throughout Jackson County.
    </p>

    <div class="search-box">

      <input
        type="text"
        id="businessSearchInput"
        placeholder="Search businesses..."
        oninput="filterBusinesses()"
      >

      <select id="categoryFilter">

  <option value="all">
    All Categories
  </option>

  <option value="Automotive Repair">
    Automotive Repair
  </option>

  <option value="Automotive Services">
    Automotive Services
  </option>

  <option value="Churches">
    Churches
  </option>

  <option value="Custom Crafts & Fabrication">
    Custom Crafts & Fabrication
  </option>

  <option value="Entertainment">
    Entertainment
  </option>

  <option value="Fitness">
    Fitness
  </option>

  <option value="Food & Dining">
    Food & Dining
  </option>

  <option value="Gravel, Rock & Fill Dirt">
    Gravel, Rock & Fill Dirt
  </option>

  <option value="Handyman Services">
    Handyman Services
  </option>

  <option value="Health & Beauty">
    Health & Beauty
  </option>

  <option value="Home Improvement">
    Home Improvement
  </option>

  <option value="IT & Computer Repair">
    IT & Computer Repair
  </option>

  <option value="Land Clearing & Tractor Services">
    Land Clearing & Tractor Services
  </option>

  <option value="Landscaping">
    Landscaping
  </option>

  <option value="Locksmithing">
    Locksmithing
  </option>

  <option value="Professional Services">
    Professional Services
  </option>

  <option value="Real Estate">
    Real Estate
  </option>

  <option value="Shopping">
    Shopping
  </option>

  <option value="Other">
    Other
  </option>

</select>

    </div>

    <div
      id="businessList"
      class="business-grid"
    >
    </div>

  </main>

  <script src="js/ads.js"></script>
  <script src="js/businesses.js"></script>

</body>

</html>
