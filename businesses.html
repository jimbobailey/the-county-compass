<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    The County Compass - Businesses
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <header class="site-header">

    <div class="logo">

      <img
        src="images/site/county-compass-logo.png"
        alt="The County Compass"
        class="site-logo"
      >

      <div class="logo-text">
        <span>
          The County Compass
        </span>
      </div>

    </div>

    <nav class="main-nav">

      <a href="index.html">
        Home
      </a>

      <a href="businesses.html">
        Businesses
      </a>

      <a href="coupons.html">
        Coupons
      </a>

      <a href="events.html">
        Events
      </a>

      <a href="advertise.html">
        Advertise
      </a>

    </nav>

  </header>

  <section class="page-banner businesses-banner">
  </section>

  <main class="page-section">

    <div class="featured-heading-wrap">
      <img
        src="images/site/featured.png"
        alt="Featured Businesses"
        class="featured-heading-img"
      >
    </div>

    <div id="businessesAds"></div>

    <h2 class="section-title">
      Local Business Directory
    </h2>

    <p class="page-intro">
      Find local businesses, restaurants,
      services, shops, and hidden gems
      throughout Jackson County.
    </p>

    <div class="search-box">

      <input
        type="text"
        id="businessSearchInput"
        placeholder="Search businesses..."
        oninput="filterBusinesses()"
      >

      <select
        id="categoryFilter"
        onchange="filterBusinesses()"
      >

        <option value="">
          All Categories
        </option>

        <option value="Automotive">
          Automotive
        </option>

        <option value="Food & Dining">
          Food & Dining
        </option>

        <option value="Home Services">
          Home Services
        </option>

        <option value="Health & Beauty">
          Health & Beauty
        </option>

        <option value="Shopping">
          Shopping
        </option>

        <option value="Real Estate">
          Real Estate
        </option>

        <option value="Entertainment">
          Entertainment
        </option>

        <option value="Churches">
          Churches
        </option>

        <option value="Fitness">
          Fitness
        </option>

        <option value="Professional Services">
          Professional Services
        </option>

        <option value="Other">
          Other
        </option>

      </select>

    </div>

    <div
      id="businessList"
      class="business-grid"
    >
    </div>

  </main>

  <script src="js/ads.js"></script>
  <script src="js/businesses.js"></script>

</body>

</html>
