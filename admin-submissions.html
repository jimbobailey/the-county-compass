<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Submissions | The County Compass</title>

  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;}
    header{background:#1b1b1b;border-bottom:3px solid orange;padding:20px;text-align:center;}
    header h1{margin:0;color:orange;}
    .container{max-width:1200px;margin:30px auto;padding:0 20px;}
    .submission-card{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:20px;margin-bottom:20px;}
    .submission-card h2{margin-top:0;color:orange;}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:15px;}
    .field{background:#222;border-radius:8px;padding:10px;}
    .label{color:orange;font-size:13px;margin-bottom:4px;}
    .value{word-break:break-word;}
    .submission-image{display:block;width:100%;max-width:220px;aspect-ratio:1/1;object-fit:contain;background:#f3f4f6;border-radius:8px;margin-bottom:8px;}
    .image-link{color:#66b3ff;font-weight:bold;}
    .loading{text-align:center;margin-top:50px;color:#bbb;font-size:20px;}
    .action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
    .approve-btn,.deny-btn,.delete-btn{border:none;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer;}
    .approve-btn{background:orange;color:#111;}
    .deny-btn{background:#555;color:#fff;}
    .delete-btn{background:#8b1e1e;color:#fff;}
  </style>
</head>

<body>

<header>
  <h1>County Compass Admin Submissions</h1>
</header>

<div class="container">
  <div id="loading" class="loading">Loading submissions...</div>
  <div id="submissions"></div>
</div>

<script>
const adminToken = sessionStorage.getItem("countyCompassAdminToken") || "";

if (!adminToken) {
  window.location.href = "admin.html";
}

function adminHeaders(includeJson){
  const headers = { "Authorization": "Bearer " + adminToken };
  if(includeJson){
    headers["Content-Type"] = "application/json";
  }
  return headers;
}

function clean(value){
  return value ? String(value) : "";
}

function makeField(label, value){
  return `
    <div class="field">
      <div class="label">${label}</div>
      <div class="value">${clean(value)}</div>
    </div>
  `;
}

function makeImageField(value){
  const url = clean(value);

  if(!/^https?:\/\//i.test(url)){
    return makeField("Image", "No uploaded image");
  }

  const safeUrl = url
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  return `
    <div class="field">
      <div class="label">Uploaded Image</div>
      <a href="${safeUrl}" target="_blank" rel="noopener noreferrer">
        <img class="submission-image" src="${safeUrl}" alt="Uploaded submission image">
      </a>
      <a class="image-link" href="${safeUrl}" target="_blank" rel="noopener noreferrer">
        Open full-size image
      </a>
    </div>
  `;
}

async function markSubmissionHandled(submissionId, action, approvedAs, submissionData){
  const confirmText =
    action === "deleted"
      ? "Delete this submission from the pending page?"
      : action === "denied"
        ? "Mark this submission as denied?"
        : "Approve this submission as " + approvedAs + "?";

  if(!confirm(confirmText)){
    return;
  }

  const response = await fetch("/.netlify/functions/submission-action", {
    method:"POST",
    headers:adminHeaders(true),
    body:JSON.stringify({
      submissionId,
      action,
      approvedAs: approvedAs || "",
      submissionData
    })
  });

  const result = await response.json();

  if(!result.success){
    alert(result.error || "Action failed.");
    return;
  }

  const card = document.getElementById("submission-card-" + submissionId);
  if(card){
    card.remove();
  }

  const container = document.getElementById("submissions");
  if(container && !container.querySelector(".submission-card")){
    container.innerHTML = `
      <div class="submission-card">
        <h2>No pending submissions.</h2>
      </div>
    `;
  }
}

async function loadSubmissions(){
  try{
    const [submissionsResponse, handledResponse] = await Promise.all([
      fetch("/.netlify/functions/get-submissions", { headers: adminHeaders(false) }),
      fetch("/.netlify/functions/submission-action", { headers: adminHeaders(false) })
    ]);

    const data = await submissionsResponse.json();
    const handledData = await handledResponse.json();

    if(!submissionsResponse.ok){
      throw new Error(data.error || "Pending submissions could not be loaded.");
    }

    if(!handledResponse.ok){
      throw new Error(handledData.error || "Submission history could not be loaded.");
    }

    const handledIds = Array.isArray(handledData)
      ? handledData.map(item => item.submissionId)
      : [];

    const loading = document.getElementById("loading");
    const container = document.getElementById("submissions");

    loading.style.display = "none";
    container.innerHTML = "";

    const allSubmissions = Array.isArray(data.submissions)
      ? data.submissions
      : [];

    const pendingSubmissions = allSubmissions
      .filter(sub => !handledIds.includes(sub.id))
      .reverse();

    if(!pendingSubmissions.length){
      container.innerHTML = `
        <div class="submission-card">
          <h2>No pending submissions.</h2>
        </div>
      `;
      return;
    }

    pendingSubmissions.forEach(function(sub){
      const payload = sub.data || {};
      const card = document.createElement("div");
      card.className = "submission-card";
      card.id = "submission-card-" + sub.id;

      card.innerHTML = `
        <h2>${clean(payload.businessName) || "Unnamed Submission"}</h2>

        <div class="grid">
          ${makeField("Submission ID", sub.id)}
          ${makeField("Submission Type", payload.submissionType)}
          ${makeField("Contact Name", payload.contactName)}
          ${makeField("Email", payload.email)}
          ${makeField("Phone", payload.phone)}
          ${makeField("Category", payload.category)}
          ${makeField("Package Length", payload.packageLength)}
          ${makeField("Start Date", payload.startDate)}
          ${makeField("End Date", payload.endDate)}
          ${makeField("Website", payload.website)}
          ${makeImageField(payload.imageUrl)}
          ${makeField("Image Processor", payload.resizeBuildMarker)}
          ${makeField("Source Dimensions", payload.resizeSourceDimensions)}
          ${makeField("Output Dimensions", payload.resizeOutputDimensions)}
        </div>

        <div class="field" style="margin-top:15px;">
          <div class="label">Title</div>
          <div class="value">${clean(payload.title)}</div>
        </div>

        <div class="field" style="margin-top:15px;">
          <div class="label">Description</div>
          <div class="value">${clean(payload.description)}</div>
        </div>

        <div class="field" style="margin-top:15px;">
          <div class="label">Notes</div>
          <div class="value">${clean(payload.notes)}</div>
        </div>
      `;

      const actionRow = document.createElement("div");
      actionRow.className = "action-row";

      [
        ["Business", "business"],
        ["Deal", "coupon"],
        ["Event", "event"],
        ["Hiring", "hiring"],
        ["Sponsor", "sponsor"]
      ].forEach(function(item){
        const button = document.createElement("button");
        button.className = "approve-btn";
        button.textContent = "Approve as " + item[0];
        button.onclick = function(){
          markSubmissionHandled(sub.id, "approved", item[1], payload);
        };
        actionRow.appendChild(button);
      });

      const denyButton = document.createElement("button");
      denyButton.className = "deny-btn";
      denyButton.textContent = "Deny";
      denyButton.onclick = function(){
        markSubmissionHandled(sub.id, "denied", "", payload);
      };
      actionRow.appendChild(denyButton);

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-btn";
      deleteButton.textContent = "Delete";
      deleteButton.onclick = function(){
        markSubmissionHandled(sub.id, "deleted", "", payload);
      };
      actionRow.appendChild(deleteButton);

      card.appendChild(actionRow);
      container.appendChild(card);
    });

  }catch(error){
    document.getElementById("loading").innerHTML = "Failed to load submissions.";
    console.error(error);
  }
}

loadSubmissions();
</script>

</body>
</html>
