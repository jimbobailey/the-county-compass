<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    The County Compass - Events
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <header class="site-header">

    <div class="logo">

      <img
        src="images/site/county-compass-logo.png"
        alt="The County Compass"
        class="site-logo"
      >

      <div class="logo-text">
        <span>
          The County Compass
        </span>
      </div>

    </div>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="businesses.html">Businesses</a>
      <a href="coupons.html">Coupons</a>
      <a href="events.html">Events</a>
      <a href="advertise.html">Advertise</a>
      <a href="contact.html">Contact</a>
    </nav>

   </header>

   <section class="page-banner">
   <img
    src="images/site/events-banner.png"
    alt="Events Banner"
    class="page-banner-img"
   >
   </section>

  <main class="page-section">

    <h2 class="section-title">
      Local Sponsors
    </h2>

    <div id="eventsAds"></div>

    <div class="featured-heading-wrap">
      <img
        src="images/site/featured.png"
        alt="Featured Businesses"
        class="featured-heading-img"
      >
    </div>

    <div
      id="featuredBusinesses"
      class="business-grid"
    >
    </div>

    <h2 class="section-title">
      Community Events
    </h2>

    <div
      id="eventsList"
      class="business-grid"
    >
    </div>

  </main>

  <script src="js/ads.js"></script>
  <script src="js/site.js"></script>
  <script src="js/events.js"></script>

</body>

</html>
