<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    The County Compass - Events
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <header class="site-header">

    <div class="logo">

      <img
        src="images/site/county-compass-logo.png"
        alt="The County Compass"
        class="site-logo"
      >

      <div class="logo-text">
        <span>
          The County Compass
        </span>
      </div>

    </div>

    <nav class="main-nav">

      <a href="index.html">
        Home
      </a>

      <a href="businesses.html">
        Businesses
      </a>

      <a href="coupons.html">
        Coupons
      </a>

      <a href="events.html">
        Events
      </a>

      <a href="advertise.html">
        Advertise
      </a>

    </nav>

  </header>

  <section class="page-banner events-banner">
  </section>

  <main class="page-section">

    <div class="featured-heading-wrap">
      <img
        src="images/site/featured.png"
        alt="Featured Businesses"
        class="featured-heading-img"
      >
    </div>

    <div id="eventsAds"></div>

    <h2 class="section-title">
      Community Events
    </h2>

    <p class="page-intro">
      Discover local festivals, concerts,
      church gatherings, school events,
      sports, community activities,
      and more happening throughout
      Jackson County.

    <div
      id="eventList"
      class="business-grid"

  <script src="js/ads.js"></script>
  <script src="js/events.js"></script>
